# downloads.example.com — 品牌下载静态站（桌面安装包 / APK / electron-updater feed）
# 由 sync:release-cdn / downloads-remote-install.sh 同步到 nginx sites-available。
# Tunnel 远程托管 ingress 时：在 Cloudflare Zero Trust → Tunnel 加 Public Hostname
#   downloads.<brand> → http://127.0.0.1:8092
# 实际域名用 env 覆盖（默认占位 downloads.example.com）。

server {
    listen 127.0.0.1:8092;
    server_name downloads.example.com;

    root /opt/agentcore/downloads;
    autoindex off;

    # Versioned installers: long cache. Manifests: short / no-cache.
    location ~* /(?:latest(?:-mac)?\.yml|latest\.json)$ {
        default_type application/octet-stream;
        add_header Cache-Control "public, max-age=60, must-revalidate" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=86400" always;
        add_header X-Content-Type-Options nosniff always;
    }

    types {
        application/json                           json;
        text/yaml                                  yml yaml;
        application/octet-stream                   exe blockmap;
        application/x-apple-diskimage              dmg;
        application/zip                            zip;
        application/vnd.android.package-archive    apk;
    }
}
