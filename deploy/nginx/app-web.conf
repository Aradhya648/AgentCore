# app.fashitianxia.xyz — serve the WEB CLIENT (apps/desktop → dist-web) SAME-ORIGIN at "/"
# alongside the existing API. The web client (form A: the desktop renderer in a browser)
# lives at app.fashitianxia.xyz/ and the API at app.fashitianxia.xyz/api/ on this SAME
# server block → first-party cookies, zero CORS.
#
# ⚠️ REFERENCE SNIPPET. The real app. server block (TLS + the /api, /api/ws, /storage,
# /internal, /_market proxies) lives in /etc/nginx/sites-available/app.fashitianxia.xyz on
# the production machine and is NOT in this repo. Merge the `root` + `location /` + `/assets/`
# below into the `:443` block; keep `/api/`, `/api/ws/`, `/storage/`, `/internal/`, `/_market/`
# exactly as they are.
#
# IMPORTANT — this REPLACES an existing catch-all. Before the web client, that block had a
# `location / { proxy_pass http://127.0.0.1:8000; }` sending every non-/api, non-/storage path
# to the API (which served `/docs` + `/openapi.json`, else 404 — the old "/legal" comment was
# stale, no such route). Swapping it for the static `location /` below means `/docs` and
# `/openapi.json` are NO LONGER served publicly (they fall to the SPA shell) — intended: the
# FastAPI docs should not be public on prod. Applied to production 2026-06-30 (a timestamped
# `.bak.web-*` backup of the original block sits next to the file for rollback).
#
# nginx matches the most specific prefix first, so /api/ and /storage/ keep winning for
# those paths and `location /` only catches everything else (the SPA shell + its assets).
# Routing is hash-based (createHashRouter), so try_files only needs to serve index.html
# at the root; deep links carry their route in the URL fragment (never hits the server).
#
# Deploy refreshes the files: `pnpm -C apps/desktop deploy:web` → /opt/agentcore/web/dist.

# --- add inside `server { server_name app.fashitianxia.xyz; ... }` ---

    root /opt/agentcore/web/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Long-cache the content-hashed build assets; never cache the HTML shell so a new
    # deploy is picked up immediately.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # --- keep AS-IS (already present in the app. block; shown for placement only) ---
    # location /api/     { proxy_pass http://127.0.0.1:8000/; proxy_buffering off; ... }  # SSE
    # location /storage/ { proxy_pass http://minio:9000/;     proxy_set_header Host minio:9000; ... }
