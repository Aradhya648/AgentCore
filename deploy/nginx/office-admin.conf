# office.fashitianxia.xyz — 管理后台静态 SPA（apps/admin）
# 由 deploy-admin.yml 同步到生产机 sites-available 并 reload nginx。
# Cloudflare Tunnel 将 office 子域指到本机 Nginx（与 *. 兜底共存时靠 server_name 匹配）。

server {
    listen 127.0.0.1:8090;
    server_name office.fashitianxia.xyz;

    root /opt/agentcore/admin/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
}
