# office.example.com — 管理后台静态 SPA（apps/admin）参考 snippet。
# 由 deploy-admin.yml 或 admin-remote-install.sh 同步到 nginx sites-available 并 reload。
# 反向代理 / Tunnel 将 office 子域指到本机 Nginx（与通配兜底共存时靠 server_name 匹配）。
# 实际域名用 env / GitHub vars 覆盖（默认占位 office.example.com）。

server {
    listen 127.0.0.1:8090;
    server_name office.example.com;

    root /opt/agentcore/admin/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
}
