name: Bug report
description: Report a bug or unexpected behavior
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Security issues → see [SECURITY.md](../../SECURITY.md) (do not file a public issue).
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What went wrong in one or two sentences?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Minimal steps to reproduce the problem.
      placeholder: |
        1. …
        2. …
        3. …
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - apps/server
        - apps/desktop
        - apps/mobile
        - apps/admin
        - apps/website
        - packages
        - docs / tooling
        - other
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version / commit
      description: App version, release tag, or commit SHA if known.
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, browser/Electron version, or other relevant details.
  - type: textarea
    id: extras
    attributes:
      label: Additional context
      description: Logs, screenshots, or related issues (no secrets).
