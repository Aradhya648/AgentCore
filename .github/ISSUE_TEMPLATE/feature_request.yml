name: Feature request
description: Suggest an idea or improvement
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Describe the problem and the outcome you want. Implementation details are optional.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem does this solve? Who is affected?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What would you like to see happen?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you thought about, if any.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - apps/server
        - apps/desktop
        - apps/mobile
        - apps/admin
        - apps/website
        - packages
        - docs / tooling
        - other
    validations:
      required: true
  - type: textarea
    id: extras
    attributes:
      label: Additional context
      description: Mockups, related issues, or examples from other products.
