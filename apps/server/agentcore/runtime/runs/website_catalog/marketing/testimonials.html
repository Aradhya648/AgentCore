<!-- catalog:testimonials · 证言；禁假指标墙 -->
<section class="catalog-shell site-testimonials" id="testimonials" data-catalog="testimonials">
  <div style="max-width:var(--max-width);margin:0 auto;padding:var(--space-4) var(--space-2);">
    <h2 style="font-family:var(--font-display);margin:0 0 var(--space-3);">{{section_title}}</h2>
    <div class="site-testimonials__grid" style="display:grid;gap:var(--space-3);grid-template-columns:repeat(auto-fit,minmax(18rem,1fr));">
      <blockquote class="site-testimonials__item" id="quote-1" style="margin:0;padding:var(--space-2);border-left:3px solid var(--color-accent);background:var(--color-surface);">
        <p style="margin:0 0 var(--space-2);">{{quote_1}}</p>
        <footer style="color:var(--color-muted);font-size:0.875rem;">{{attribution_1}}</footer>
      </blockquote>
      <blockquote class="site-testimonials__item" id="quote-2" style="margin:0;padding:var(--space-2);border-left:3px solid var(--color-accent);background:var(--color-surface);">
        <p style="margin:0 0 var(--space-2);">{{quote_2}}</p>
        <footer style="color:var(--color-muted);font-size:0.875rem;">{{attribution_2}}</footer>
      </blockquote>
    </div>
  </div>
</section>
