<!-- catalog:cta · 收束行动号召；勿再发明整站导航 -->
<section class="catalog-shell site-cta" id="cta" data-catalog="cta">
  <div style="max-width:var(--max-width);margin:0 auto;padding:var(--space-4) var(--space-2);text-align:center;">
    <h2 style="font-family:var(--font-display);margin:0 0 var(--space-2);">{{headline}}</h2>
    <p style="color:var(--color-muted);margin:0 0 var(--space-3);max-width:32rem;margin-left:auto;margin-right:auto;">{{support}}</p>
    <a class="btn" href="{{cta_href}}">{{cta_label}}</a>
  </div>
</section>
