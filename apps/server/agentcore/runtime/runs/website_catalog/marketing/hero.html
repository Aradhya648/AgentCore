<!-- catalog:hero · 单一构图首屏；禁统计条/多卡堆叠 -->
<section class="catalog-shell site-hero" id="hero" data-catalog="hero">
  <div class="site-hero__inner" style="max-width:var(--max-width);margin:0 auto;padding:var(--space-4) var(--space-2);">
    <p class="site-hero__brand" style="font-family:var(--font-display);color:var(--color-muted);margin:0 0 var(--space-1);">{{brand}}</p>
    <h1 class="site-hero__title" style="font-family:var(--font-display);font-size:clamp(2rem,5vw,3.25rem);line-height:1.15;margin:0 0 var(--space-2);color:var(--color-fg);">{{headline}}</h1>
    <p class="site-hero__support" style="max-width:36rem;color:var(--color-muted);margin:0 0 var(--space-3);">{{support}}</p>
    <div class="site-hero__actions" style="display:flex;flex-wrap:wrap;gap:var(--space-2);">
      <a class="btn" href="#cta">{{primary_cta}}</a>
      <a class="btn btn-ghost" href="#features">{{secondary_cta}}</a>
    </div>
  </div>
</section>
