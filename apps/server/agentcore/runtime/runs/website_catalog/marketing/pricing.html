<!-- catalog:pricing · 2–3 档；强调一档 -->
<section class="catalog-shell site-pricing" id="pricing" data-catalog="pricing">
  <div style="max-width:var(--max-width);margin:0 auto;padding:var(--space-4) var(--space-2);">
    <h2 style="font-family:var(--font-display);margin:0 0 var(--space-1);">{{section_title}}</h2>
    <p style="color:var(--color-muted);margin:0 0 var(--space-3);">{{section_lead}}</p>
    <div class="site-pricing__grid" style="display:grid;gap:var(--space-3);grid-template-columns:repeat(auto-fit,minmax(14rem,1fr));align-items:stretch;">
      <article class="site-pricing__plan" id="plan-basic" style="padding:var(--space-3);border:1px solid var(--color-border);border-radius:var(--radius);">
        <h3 style="font-family:var(--font-display);margin:0 0 var(--space-1);">{{plan_1_name}}</h3>
        <p class="site-pricing__price" style="font-size:1.75rem;margin:0 0 var(--space-2);">{{plan_1_price}}</p>
        <ul style="margin:0 0 var(--space-3);padding-left:1.25rem;color:var(--color-muted);">
          <li>{{plan_1_feat_1}}</li>
          <li>{{plan_1_feat_2}}</li>
        </ul>
        <a class="btn btn-ghost" href="#cta">{{plan_1_cta}}</a>
      </article>
      <article class="site-pricing__plan is-featured" id="plan-pro" style="padding:var(--space-3);border:2px solid var(--color-accent);border-radius:var(--radius);background:var(--color-surface);">
        <h3 style="font-family:var(--font-display);margin:0 0 var(--space-1);">{{plan_2_name}}</h3>
        <p class="site-pricing__price" style="font-size:1.75rem;margin:0 0 var(--space-2);">{{plan_2_price}}</p>
        <ul style="margin:0 0 var(--space-3);padding-left:1.25rem;color:var(--color-muted);">
          <li>{{plan_2_feat_1}}</li>
          <li>{{plan_2_feat_2}}</li>
          <li>{{plan_2_feat_3}}</li>
        </ul>
        <a class="btn" href="#cta">{{plan_2_cta}}</a>
      </article>
    </div>
  </div>
</section>
