<!-- catalog:nav · 顶栏导航空壳；填品牌名与锚点文案，勿另起 mega-menu -->
<header class="catalog-shell site-nav" id="site-nav" data-catalog="nav">
  <div class="site-nav__inner" style="display:flex;align-items:center;justify-content:space-between;gap:var(--space-2);max-width:var(--max-width);margin:0 auto;padding:var(--space-2);">
    <a class="site-nav__brand" href="#hero" style="font-family:var(--font-display);font-weight:600;color:var(--color-fg);text-decoration:none;">{{brand}}</a>
    <nav class="site-nav__links" aria-label="Primary" style="display:flex;gap:var(--space-2);align-items:center;">
      <a href="#features" style="color:var(--color-muted);text-decoration:none;">{{link_1}}</a>
      <a href="#pricing" style="color:var(--color-muted);text-decoration:none;">{{link_2}}</a>
      <a href="#faq" style="color:var(--color-muted);text-decoration:none;">{{link_3}}</a>
      <a class="btn" href="#cta">{{cta_label}}</a>
    </nav>
  </div>
</header>
