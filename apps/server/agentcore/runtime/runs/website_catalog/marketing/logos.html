<!-- catalog:logos · 信任条；少文案 -->
<section class="catalog-shell site-logos" id="logos" data-catalog="logos" aria-label="Trusted by">
  <div style="max-width:var(--max-width);margin:0 auto;padding:var(--space-3) var(--space-2);">
    <p style="margin:0 0 var(--space-2);color:var(--color-muted);font-size:0.875rem;">{{eyebrow}}</p>
    <ul class="site-logos__list" style="list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:var(--space-3);align-items:center;opacity:0.7;">
      <li class="site-logos__item" data-logo="1">{{logo_1}}</li>
      <li class="site-logos__item" data-logo="2">{{logo_2}}</li>
      <li class="site-logos__item" data-logo="3">{{logo_3}}</li>
      <li class="site-logos__item" data-logo="4">{{logo_4}}</li>
    </ul>
  </div>
</section>
