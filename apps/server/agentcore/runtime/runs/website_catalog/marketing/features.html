<!-- catalog:features · 卖点区；避免三等分 icon 八股，可 2–4 块 -->
<section class="catalog-shell site-features" id="features" data-catalog="features">
  <div style="max-width:var(--max-width);margin:0 auto;padding:var(--space-4) var(--space-2);">
    <h2 style="font-family:var(--font-display);margin:0 0 var(--space-1);">{{section_title}}</h2>
    <p style="color:var(--color-muted);margin:0 0 var(--space-3);max-width:40rem;">{{section_lead}}</p>
    <div class="site-features__grid" style="display:grid;gap:var(--space-3);grid-template-columns:repeat(auto-fit,minmax(16rem,1fr));">
      <article class="site-features__item" id="feature-1" style="padding:var(--space-2);border:1px solid var(--color-border);border-radius:var(--radius);background:var(--color-surface);">
        <h3 style="font-family:var(--font-display);margin:0 0 var(--space-1);">{{feature_1_title}}</h3>
        <p style="margin:0;color:var(--color-muted);">{{feature_1_body}}</p>
      </article>
      <article class="site-features__item" id="feature-2" style="padding:var(--space-2);border:1px solid var(--color-border);border-radius:var(--radius);background:var(--color-surface);">
        <h3 style="font-family:var(--font-display);margin:0 0 var(--space-1);">{{feature_2_title}}</h3>
        <p style="margin:0;color:var(--color-muted);">{{feature_2_body}}</p>
      </article>
      <article class="site-features__item" id="feature-3" style="padding:var(--space-2);border:1px solid var(--color-border);border-radius:var(--radius);background:var(--color-surface);">
        <h3 style="font-family:var(--font-display);margin:0 0 var(--space-1);">{{feature_3_title}}</h3>
        <p style="margin:0;color:var(--color-muted);">{{feature_3_body}}</p>
      </article>
    </div>
  </div>
</section>
