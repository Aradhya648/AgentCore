<!-- catalog:faq · details/summary 手风琴 -->
<section class="catalog-shell site-faq" id="faq" data-catalog="faq">
  <div style="max-width:40rem;margin:0 auto;padding:var(--space-4) var(--space-2);">
    <h2 style="font-family:var(--font-display);margin:0 0 var(--space-3);">{{section_title}}</h2>
    <div class="site-faq__list">
      <details class="site-faq__item" id="faq-1" style="border-bottom:1px solid var(--color-border);padding:var(--space-2) 0;">
        <summary style="cursor:pointer;font-family:var(--font-display);">{{q_1}}</summary>
        <p style="margin:var(--space-1) 0 0;color:var(--color-muted);">{{a_1}}</p>
      </details>
      <details class="site-faq__item" id="faq-2" style="border-bottom:1px solid var(--color-border);padding:var(--space-2) 0;">
        <summary style="cursor:pointer;font-family:var(--font-display);">{{q_2}}</summary>
        <p style="margin:var(--space-1) 0 0;color:var(--color-muted);">{{a_2}}</p>
      </details>
      <details class="site-faq__item" id="faq-3" style="border-bottom:1px solid var(--color-border);padding:var(--space-2) 0;">
        <summary style="cursor:pointer;font-family:var(--font-display);">{{q_3}}</summary>
        <p style="margin:var(--space-1) 0 0;color:var(--color-muted);">{{a_3}}</p>
      </details>
    </div>
  </div>
</section>
