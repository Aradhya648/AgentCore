<!-- catalog:how_it_works · ≤3 步流程 -->
<section class="catalog-shell site-steps" id="how-it-works" data-catalog="how_it_works">
  <div style="max-width:var(--max-width);margin:0 auto;padding:var(--space-4) var(--space-2);">
    <h2 style="font-family:var(--font-display);margin:0 0 var(--space-3);">{{section_title}}</h2>
    <ol class="site-steps__list" style="margin:0;padding:0;list-style:none;display:grid;gap:var(--space-3);">
      <li class="site-steps__item" data-step="1" style="display:grid;grid-template-columns:auto 1fr;gap:var(--space-2);">
        <span aria-hidden="true" style="font-family:var(--font-display);color:var(--color-accent);">01</span>
        <div>
          <h3 style="margin:0 0 var(--space-1);font-family:var(--font-display);">{{step_1_title}}</h3>
          <p style="margin:0;color:var(--color-muted);">{{step_1_body}}</p>
        </div>
      </li>
      <li class="site-steps__item" data-step="2" style="display:grid;grid-template-columns:auto 1fr;gap:var(--space-2);">
        <span aria-hidden="true" style="font-family:var(--font-display);color:var(--color-accent);">02</span>
        <div>
          <h3 style="margin:0 0 var(--space-1);font-family:var(--font-display);">{{step_2_title}}</h3>
          <p style="margin:0;color:var(--color-muted);">{{step_2_body}}</p>
        </div>
      </li>
      <li class="site-steps__item" data-step="3" style="display:grid;grid-template-columns:auto 1fr;gap:var(--space-2);">
        <span aria-hidden="true" style="font-family:var(--font-display);color:var(--color-accent);">03</span>
        <div>
          <h3 style="margin:0 0 var(--space-1);font-family:var(--font-display);">{{step_3_title}}</h3>
          <p style="margin:0;color:var(--color-muted);">{{step_3_body}}</p>
        </div>
      </li>
    </ol>
  </div>
</section>
