<!-- catalog:detail_panel · 详情面板；右侧/抽屉信息，非营销证言卡 -->
<aside class="catalog-shell tool-detail-panel" id="tool-detail-panel" data-catalog="detail_panel"
  style="border:1px solid var(--color-border);border-radius:var(--radius);background:var(--color-surface);padding:var(--space-2);margin:0 var(--space-2) var(--space-3);max-width:24rem;">
  <header class="tool-detail-panel__header" style="display:flex;align-items:center;justify-content:space-between;gap:var(--space-2);margin-bottom:var(--space-2);">
    <h2 style="font-family:var(--font-display);font-size:1rem;margin:0;color:var(--color-fg);">{{detail_title}}</h2>
    <button type="button" class="btn-ghost" style="padding:0.25rem 0.5rem;">{{close_label}}</button>
  </header>
  <div class="tool-detail-panel__body" style="display:flex;flex-direction:column;gap:var(--space-2);font-size:0.875rem;">
    <div>
      <div style="color:var(--color-muted);font-size:0.75rem;">{{field_1_label}}</div>
      <div style="color:var(--color-fg);">{{field_1_value}}</div>
    </div>
    <div>
      <div style="color:var(--color-muted);font-size:0.75rem;">{{field_2_label}}</div>
      <div style="color:var(--color-fg);">{{field_2_value}}</div>
    </div>
    <p style="margin:0;color:var(--color-muted);">{{detail_notes}}</p>
  </div>
</aside>
