<!-- catalog:filter_bar · 筛选条；紧凑横排，禁装饰粒子 -->
<div class="catalog-shell tool-filter-bar" id="tool-filter-bar" data-catalog="filter_bar"
  style="display:flex;flex-wrap:wrap;align-items:flex-end;gap:var(--space-2);padding:0 var(--space-2) var(--space-2);">
  <label class="tool-filter-bar__field" style="display:flex;flex-direction:column;gap:0.25rem;font-size:0.75rem;color:var(--color-muted);">
    {{filter_1_label}}
    <select style="padding:var(--space-1);border:1px solid var(--color-border);border-radius:var(--radius);background:var(--color-bg);color:var(--color-fg);font:inherit;">
      <option>{{filter_1_option}}</option>
    </select>
  </label>
  <label class="tool-filter-bar__field" style="display:flex;flex-direction:column;gap:0.25rem;font-size:0.75rem;color:var(--color-muted);">
    {{filter_2_label}}
    <input type="text" placeholder="{{filter_2_placeholder}}" style="padding:var(--space-1);border:1px solid var(--color-border);border-radius:var(--radius);background:var(--color-bg);color:var(--color-fg);font:inherit;" />
  </label>
  <button type="button" class="btn-ghost">{{apply_label}}</button>
</div>
