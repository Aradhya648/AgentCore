<!-- catalog:empty_state · 空态；短说明 + 主操作，禁假拉丁填充 -->
<div class="catalog-shell tool-empty-state" id="tool-empty-state" data-catalog="empty_state"
  style="display:flex;flex-direction:column;align-items:center;justify-content:center;gap:var(--space-2);padding:var(--space-4) var(--space-2);text-align:center;border:1px dashed var(--color-border);border-radius:var(--radius);margin:0 var(--space-2) var(--space-3);background:var(--color-bg);">
  <h2 class="tool-empty-state__title" style="font-family:var(--font-display);font-size:1.125rem;margin:0;color:var(--color-fg);">{{empty_title}}</h2>
  <p class="tool-empty-state__body" style="margin:0;max-width:28rem;color:var(--color-muted);font-size:0.875rem;">{{empty_body}}</p>
  <div class="tool-empty-state__actions" style="display:flex;flex-wrap:wrap;gap:var(--space-1);justify-content:center;">
    <button type="button" class="btn">{{primary_action}}</button>
    <button type="button" class="btn-ghost">{{secondary_action}}</button>
  </div>
</div>
