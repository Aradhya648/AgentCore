<!-- catalog:app_shell · 外框：侧栏槽 + 主工作区槽；禁营销 hero 全幅首屏 -->
<div class="catalog-shell tool-app-shell" id="tool-app-shell" data-catalog="app_shell"
  style="display:grid;grid-template-columns:var(--sidebar-width) 1fr;min-height:100vh;background:var(--color-bg);">
  <aside class="tool-app-shell__sidebar" style="border-right:1px solid var(--color-border);background:var(--color-surface);">
    <!-- SLOT:sidebar -->
    <p style="margin:var(--space-2);color:var(--color-muted);font-size:0.875rem;">{{sidebar_slot}}</p>
  </aside>
  <div class="tool-app-shell__main" style="display:flex;flex-direction:column;min-width:0;">
    <!-- SLOT:topbar + page content -->
    <p style="margin:var(--space-2);color:var(--color-muted);font-size:0.875rem;">{{main_slot}}</p>
  </div>
</div>
