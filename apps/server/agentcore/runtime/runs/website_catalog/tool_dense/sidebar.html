<!-- catalog:sidebar · 侧栏导航；克制列表，禁巨型 mega-menu / 营销价卡 -->
<nav class="catalog-shell tool-sidebar" id="tool-sidebar" data-catalog="sidebar" aria-label="App"
  style="padding:var(--space-2);display:flex;flex-direction:column;gap:var(--space-1);height:100%;">
  <a class="tool-sidebar__brand" href="#" style="font-family:var(--font-display);font-weight:600;color:var(--color-fg);text-decoration:none;padding:var(--space-1) 0;">{{product_name}}</a>
  <ul class="tool-sidebar__nav" style="list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:var(--space-1);">
    <li><a class="tool-sidebar__item" href="#tool-data-table" style="display:block;padding:var(--space-1);color:var(--color-fg);text-decoration:none;border-radius:var(--radius);background:var(--color-bg);">{{nav_1}}</a></li>
    <li><a class="tool-sidebar__item" href="#" style="display:block;padding:var(--space-1);color:var(--color-muted);text-decoration:none;border-radius:var(--radius);">{{nav_2}}</a></li>
    <li><a class="tool-sidebar__item" href="#" style="display:block;padding:var(--space-1);color:var(--color-muted);text-decoration:none;border-radius:var(--radius);">{{nav_3}}</a></li>
  </ul>
</nav>
