<!-- catalog:page_header · 页头：标题 + 主操作；禁统计条/hero 构图 -->
<div class="catalog-shell tool-page-header" id="tool-page-header" data-catalog="page_header"
  style="display:flex;align-items:flex-start;justify-content:space-between;gap:var(--space-2);padding:var(--space-3) var(--space-2) var(--space-2);">
  <div class="tool-page-header__titles" style="min-width:0;">
    <h1 style="font-family:var(--font-display);font-size:1.25rem;margin:0 0 var(--space-1);color:var(--color-fg);">{{page_title}}</h1>
    <p style="margin:0;color:var(--color-muted);font-size:0.875rem;">{{page_subtitle}}</p>
  </div>
  <div class="tool-page-header__actions" style="display:flex;flex-wrap:wrap;gap:var(--space-1);">
    <button type="button" class="btn-ghost">{{secondary_action}}</button>
    <button type="button" class="btn">{{primary_action}}</button>
  </div>
</div>
