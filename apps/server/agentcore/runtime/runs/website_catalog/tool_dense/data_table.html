<!-- catalog:data_table · 数据表；稳定列头与行 id，禁假指标墙 -->
<section class="catalog-shell tool-data-table" id="tool-data-table" data-catalog="data_table"
  style="padding:0 var(--space-2) var(--space-3);">
  <div style="overflow:auto;border:1px solid var(--color-border);border-radius:var(--radius);background:var(--color-bg);">
    <table class="tool-data-table__table" style="width:100%;border-collapse:collapse;font-size:0.875rem;">
      <thead>
        <tr style="background:var(--color-surface);text-align:left;">
          <th style="padding:var(--space-1) var(--space-2);border-bottom:1px solid var(--color-border);color:var(--color-muted);font-weight:600;">{{col_1}}</th>
          <th style="padding:var(--space-1) var(--space-2);border-bottom:1px solid var(--color-border);color:var(--color-muted);font-weight:600;">{{col_2}}</th>
          <th style="padding:var(--space-1) var(--space-2);border-bottom:1px solid var(--color-border);color:var(--color-muted);font-weight:600;">{{col_3}}</th>
          <th style="padding:var(--space-1) var(--space-2);border-bottom:1px solid var(--color-border);color:var(--color-muted);font-weight:600;">{{col_4}}</th>
        </tr>
      </thead>
      <tbody>
        <tr class="tool-data-table__row" id="tool-row-1">
          <td style="padding:var(--space-1) var(--space-2);border-bottom:1px solid var(--color-border);">{{row_1_c1}}</td>
          <td style="padding:var(--space-1) var(--space-2);border-bottom:1px solid var(--color-border);color:var(--color-muted);">{{row_1_c2}}</td>
          <td style="padding:var(--space-1) var(--space-2);border-bottom:1px solid var(--color-border);color:var(--color-muted);">{{row_1_c3}}</td>
          <td style="padding:var(--space-1) var(--space-2);border-bottom:1px solid var(--color-border);"><a href="#tool-detail-panel" style="color:var(--color-accent);">{{row_1_action}}</a></td>
        </tr>
        <tr class="tool-data-table__row" id="tool-row-2">
          <td style="padding:var(--space-1) var(--space-2);border-bottom:1px solid var(--color-border);">{{row_2_c1}}</td>
          <td style="padding:var(--space-1) var(--space-2);border-bottom:1px solid var(--color-border);color:var(--color-muted);">{{row_2_c2}}</td>
          <td style="padding:var(--space-1) var(--space-2);border-bottom:1px solid var(--color-border);color:var(--color-muted);">{{row_2_c3}}</td>
          <td style="padding:var(--space-1) var(--space-2);border-bottom:1px solid var(--color-border);"><a href="#tool-detail-panel" style="color:var(--color-accent);">{{row_2_action}}</a></td>
        </tr>
        <tr class="tool-data-table__row" id="tool-row-3">
          <td style="padding:var(--space-1) var(--space-2);">{{row_3_c1}}</td>
          <td style="padding:var(--space-1) var(--space-2);color:var(--color-muted);">{{row_3_c2}}</td>
          <td style="padding:var(--space-1) var(--space-2);color:var(--color-muted);">{{row_3_c3}}</td>
          <td style="padding:var(--space-1) var(--space-2);"><a href="#tool-detail-panel" style="color:var(--color-accent);">{{row_3_action}}</a></td>
        </tr>
      </tbody>
    </table>
  </div>
</section>
