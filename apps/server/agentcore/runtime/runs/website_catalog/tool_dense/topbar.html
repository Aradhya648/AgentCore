<!-- catalog:topbar · 顶栏：面包屑/搜索/用户；矮 dense，非营销横幅 -->
<header class="catalog-shell tool-topbar" id="tool-topbar" data-catalog="topbar"
  style="display:flex;align-items:center;justify-content:space-between;gap:var(--space-2);min-height:var(--topbar-height);padding:0 var(--space-2);border-bottom:1px solid var(--color-border);background:var(--color-bg);">
  <div class="tool-topbar__left" style="display:flex;align-items:center;gap:var(--space-2);min-width:0;">
    <nav aria-label="Breadcrumb" style="color:var(--color-muted);font-size:0.875rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">{{breadcrumb}}</nav>
  </div>
  <div class="tool-topbar__right" style="display:flex;align-items:center;gap:var(--space-2);">
    <label class="tool-topbar__search" style="display:flex;align-items:center;">
      <span class="visually-hidden" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);">Search</span>
      <input type="search" placeholder="{{search_placeholder}}" style="padding:var(--space-1);border:1px solid var(--color-border);border-radius:var(--radius);background:var(--color-surface);color:var(--color-fg);font:inherit;min-width:10rem;" />
    </label>
    <span style="color:var(--color-muted);font-size:0.875rem;">{{user_label}}</span>
  </div>
</header>
